<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的网页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #0f347f;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 48px;
      max-width: 520px;
      width: 90%;
      text-align: center;
    }

    h1 {
      color: #1ca49d;
      font-size: 28px;
      margin-bottom: 16px;
    }

    p {
      color: #666;
      line-height: 1.8;
      margin-bottom: 24px;
    }

    button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    #output {
      margin-top: 20px;
      color: #764ba2;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>你好，世界！</h1>
    <p>这是一个使用 HTML + CSS + JavaScript 构建的示例页面。点击下方按钮试试交互效果。</p>
    <button id="btn">切换文字</button>
    <p id="output"></p>
  </div>

  <script>
    //标记当前状态
    let count = 0;
    document.getElementById('btn').addEventListener('click', function () {
      if(flag){}
      document.getElementById('output').textContent = 'Hello Web ' ;
    }else{
      document.getElementById('output').textContent ="网页运行成功";
    }
    flag=!flag;
  </script>
</body>
</html>
